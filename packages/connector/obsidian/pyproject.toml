[project]
name = "cognee-community-connector-obsidian"
version = "0.1.0"
description = "Obsidian vault data-source connector for cognee — sync a local vault of markdown notes into memory (incremental by mtime + content hash, wikilinks as structured links, forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs cognee 1.6: document-mode dlt sources (DOCUMENT_SOURCE_ATTR) plus the
    # per-source pipeline scope (PIPELINE_SCOPE_ATTR) that keeps our state separate.
    "cognee>=1.6.0,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_obsidian"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
